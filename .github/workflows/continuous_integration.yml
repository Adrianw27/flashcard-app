name: build script for flashcardapp

on:							
  push:
    branches: [ "main" ]			

jobs:

  build:						
    runs-on: ubuntu-latest			
    steps:
      - uses: actions/checkout@v4		
      - name: Install GTK4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: build flashcardapp	
        run: make flashcardapp
      
     

      
        
