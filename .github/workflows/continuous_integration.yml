name: build script for flashcardapp

on:							
  push:
    branches: [ "Adrians-code" ]			

jobs:

  build:						
    runs-on: ubuntu-latest			
    steps:
      - uses: actions/checkout@v4		
      - name: Install GTK4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: build flashcardapp	
        run: make flashcardapp

      - name: Upload Executables
        uses: actions/upload-artifact@v4
        with:
          name: Executables
          path: ./flashcardapp
        
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Convert Tool in Bin
        run: make flashcardapp; chmod 755 ./test_script
              
      - name: Run Tests
        run: ./test_quiz; ./test_storage
        
      - name: Upload Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: ./*.gcov
